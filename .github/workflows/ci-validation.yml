name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality & Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: JSON Validation
      run: |
        echo "Validating local.json..."
        python3 -c "import json; json.load(open('local.json'))"
        echo "✅ JSON validation passed"

    - name: YAML Validation
      run: |
        echo "Validating workflow files..."
        find .github/workflows -name "*.yml" -o -name "*.yaml" | while read file; do
          python3 -c "import yaml; yaml.safe_load(open('$file'))" && echo "✅ $file" || echo "❌ $file"
        done

    - name: Shell Script Syntax Check
      run: |
        echo "Checking Bash scripts..."
        bash -n scripts/install-linux.sh && echo "✅ install-linux.sh"
        bash -n scripts/install-macos.sh && echo "✅ install-macos.sh"

    - name: PowerShell Script Check
      shell: pwsh
      run: |
        if (Test-Path scripts/setup-windows.ps1) {
          Write-Output "✅ setup-windows.ps1 exists"
          $content = Get-Content scripts/setup-windows.ps1 -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            throw "❌ PowerShell script is empty"
          }
          Write-Output "✅ PowerShell script has content"
        } else {
          throw "❌ PowerShell script missing"
        }

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scripts: |
          scripts/install-linux.sh
          scripts/install-macos.sh

    - name: Yamllint
      run: |
        pip install yamllint
        cat > /tmp/yamllint.yml << 'EOF'
        extends: default
        rules:
          line-length: disable
          document-start: disable
          indentation:
            spaces: 2
            indent-sequences: true
        EOF
        yamllint -c /tmp/yamllint.yml .github/workflows/*.yml
