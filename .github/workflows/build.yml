name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
            ext: AppImage
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
            ext: AppImage
          - os: windows-latest
            label: windows-x86_64
            ext: exe
            arch: x86_64
          - os: macos-14
            arch: arm64
            label: macos-aarch64
            ext: dmg
          - os: macos-14
            arch: x86_64
            label: macos-x86_64
            ext: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create directories
        shell: bash
        run: mkdir -p clients dist

      - name: Copy configuration
        shell: bash
        run: cp local.json dist/local.json

      - name: Get latest Rust Desk release tag
        id: release
        shell: bash
        run: |
          TAG=$(python3 -c "import urllib.request, json; resp=urllib.request.urlopen('https://api.github.com/repos/rustdesk/rustdesk/releases/latest'); data=json.loads(resp.read()); print(data.get('tag_name','1.4.9'))" 2>/dev/null || echo "1.4.9")
          echo "Latest Rust Desk release: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Rust Desk client
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
          EXT: ${{ matrix.ext }}
          OS_FAMILY: ${{ matrix.os }}
        shell: bash
        run: |
          OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
          ASSET_ARCH=$ARCH
          if [ "$ARCH" = "arm64" ]; then
            ASSET_ARCH="aarch64"
          fi

          case "$OS_FAMILY" in
            ubuntu*)
              URLS=(
                "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
              )
              ;;
            windows*)
              URLS=(
                "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
              )
              ;;
            macos*)
              URLS=(
                "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ASSET_ARCH}.${EXT}"
                "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${ASSET_ARCH}.${EXT}"
              )
              ;;
          esac

          for try_url in "${URLS[@]}"; do
            echo "Trying: $try_url"
            if curl -sfL "$try_url" -o "dist/$OUTPUT_FILE"; then
              FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
              if [ "$FILESIZE" -gt 1000 ]; then
                echo "Downloaded: $try_url ($FILESIZE bytes)"
                cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
                break
              else
                echo "::warning::File too small: $try_url"
                rm -f "dist/$OUTPUT_FILE"
              fi
            fi
          done

          if [ ! -f "clients/$OUTPUT_FILE" ]; then
            echo "::warning::Failed to download for $LABEL"
          fi

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.label }}
          path: clients/
          if-no-files-found: warn

  consolidate:
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-clients

      - name: Assemble clients directory
        run: |
          mkdir -p clients
          for dir in all-clients/client-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* clients/ 2>/dev/null || true
            fi
          done
          ls -la clients/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd clients
          sha256sum *.AppImage *.exe *.dmg 2>/dev/null | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Update README with checksums
        shell: bash
        run: |
          cd clients
          python3 << 'PYEOF'
          import re, os

          with open('SHA256SUMS', 'r') as f:
              checksums = f.read()

          os.chdir('..')
          with open('README.md', 'r') as f:
              readme = f.read()

          lines = checksums.strip().split('\n')
          table = "| Platform | File | SHA256 (first 16 chars) |\n|----------|------|------------------------|\n"
          for line in lines:
              parts = line.split(None, 1)
              if len(parts) == 2:
                  hash_val, filename = parts
                  if 'AppImage' in filename:
                      platform = "Linux x86_64" if 'x86_64' in filename else "Linux aarch64"
                  elif 'exe' in filename:
                      platform = "Windows x86_64"
                  elif 'dmg' in filename:
                      platform = "macOS arm64" if 'aarch64' in filename else "macOS Intel"
                  else:
                      platform = filename
                  short_hash = hash_val[:16]
                  table += f"| {platform} | `{filename}` | `{short_hash}` |\n"

          new_readme = re.sub(
              r'\| Platform \| File \| SHA256.*?\n\|[-| ]+\|[-| ]+\|[-| ]+\|\n.*?\n.*?\n.*?\n.*?\n.*?\n.*?\n.*?### Verify Downloads',
              table + '\n### Verify Downloads',
              readme,
              flags=re.DOTALL
          )

          if new_readme == readme:
              print("README pattern match failed")
          else:
              with open('README.md', 'w') as f:
                  f.write(new_readme)
              print("README updated with checksums")
          PYEOF

      - name: Determine next version
        id: version
        shell: bash
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName 2>/dev/null' || echo "")
          echo "Latest release tag: $LATEST"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "version=1.0" >> $GITHUB_OUTPUT
          else
            BASE=$(echo "$LATEST" | sed 's/^v//')
            NEW_VERSION=$(python3 -c "v='$BASE'.split('.'); major=int(v[0]); minor=int(v[1]) if len(v)>1 else 0; print(f'{major}.{minor+1}')")
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi
          echo "Next version: ${{ steps.version.outputs.version }}"

      - name: Commit and push
        shell: bash
        run: |
          rm -f clients/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients/ README.md
          git commit -m "Update client packages and checksums (build ${GITHUB_SHA::8})" || echo "No changes to commit"
          git push || echo "Push failed"

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.version.outputs.version) }}
          name: ${{ format('Client Build v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
          files: clients/*
          fail_on_unmatched_files: false

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: clients/
          if-no-files-found: warn
