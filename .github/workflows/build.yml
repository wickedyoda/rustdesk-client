name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
            ext: AppImage
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
            ext: AppImage
          - os: windows-latest
            label: windows-x86_64
            ext: exe
            arch: x86_64
          - os: macos-13
            arch: x86_64
            label: macos-x86_64
            ext: dmg
          - os: macos-14
            arch: arm64
            label: macos-aarch64
            ext: dmg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create directories
      shell: bash
      run: mkdir -p clients dist

    - name: Copy configuration
      shell: bash
      run: cp local.json dist/local.json

    - name: Get latest Rust Desk release tag
      id: release
      shell: bash
      run: |
        TAG=$(curl -s "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/"tag_name": *"\([^"]*\)"/\1/')
        if [ -z "$TAG" ]; then
          TAG="1.4.9"
        fi
        echo "Latest Rust Desk release: $TAG"
        echo "tag=$TAG" >> $GITHUB_ENV

    - name: Download Rust Desk client for Linux
      if: startsWith(matrix.os, 'ubuntu')
      env:
        TAG: ${{ env.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        URL="https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
        echo "Downloading: $URL"
        curl -L "$URL" -o "dist/$OUTPUT_FILE"
        if [ -f "dist/$OUTPUT_FILE" ]; then
          FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
          if [ "$FILESIZE" -gt 1000 ]; then
            echo "Downloaded: $OUTPUT_FILE ($FILESIZE bytes)"
            cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
          else
            echo "::warning::File too small ($FILESIZE bytes)"
            rm -f "dist/$OUTPUT_FILE"
          fi
        fi

    - name: Download Rust Desk client for Windows
      if: startsWith(matrix.os, 'windows')
      env:
        TAG: ${{ env.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        URL="https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
        echo "Downloading: $URL"
        curl -L "$URL" -o "dist/$OUTPUT_FILE"
        if [ -f "dist/$OUTPUT_FILE" ]; then
          FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
          if [ "$FILESIZE" -gt 1000 ]; then
            echo "Downloaded: $OUTPUT_FILE ($FILESIZE bytes)"
            cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
          else
            echo "::warning::File too small ($FILESIZE bytes)"
            rm -f "dist/$OUTPUT_FILE"
          fi
        fi

    - name: Download Rust Desk client for macOS
      if: startsWith(matrix.os, 'macos')
      env:
        TAG: ${{ env.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        
        # Map arch names for asset URLs
        ASSET_ARCH=$ARCH
        if [ "$ARCH" = "arm64" ]; then
          ASSET_ARCH="aarch64"
        fi
        
        URLs=(
          "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ASSET_ARCH}.${EXT}"
          "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${ASSET_ARCH}.${EXT}"
        )
        
        for try_url in "${URLs[@]}"; do
          echo "Trying: $try_url"
          if curl -sf -L "$try_url" -o "dist/$OUTPUT_FILE"; then
            FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
            if [ "$FILESIZE" -gt 1000 ]; then
              echo "Downloaded successfully from: $try_url ($FILESIZE bytes)"
              cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
              break
            fi
          fi
        done
        
        if [ ! -f "clients/$OUTPUT_FILE" ]; then
          echo "::warning::Failed to download for $LABEL"
        fi

    - name: Upload client artifact
      uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.label }}
        path: clients/
        if-no-files-found: warn

    - name: Commit client binary
      if: github.event_name != 'schedule' || matrix.label == 'linux-x86_64'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add clients/
        git commit -m "Update pre-built client: ${{ matrix.label }} (build ${GITHUB_SHA::8})" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref }} || echo "Nothing to push"

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: List all client packages
        run: |
          echo "=== Pre-built clients ==="
          ls -la clients/ 2>/dev/null || echo "No clients found"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-clients
          
      - name: Assemble consolidated clients directory
        run: |
          mkdir -p _site/clients
          for dir in all-clients/client-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* _site/clients/ 2>/dev/null || true
            fi
          done
          ls -la _site/clients/

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: _site/clients/
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/clients/*
