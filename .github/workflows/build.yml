name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
            ext: AppImage
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
            ext: AppImage
          - os: windows-latest
            label: windows-x86_64
            ext: exe
            arch: x86_64
          - os: macos-13
            arch: x86_64
            label: macos-x86_64
            ext: dmg
          - os: macos-14
            arch: arm64
            label: macos-aarch64
            ext: dmg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create directories
      run: |
        if [ ! -d clients ]; then mkdir clients; fi
        if [ ! -d dist ]; then mkdir dist; fi
      shell: bash

    - name: Copy configuration
      run: cp local.json dist/local.json

    - name: Get latest Rust Desk release tag
      id: release
      shell: bash
      run: |
        TAG=$(curl -s "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/"tag_name": *"\([^"]*\)"/\1/')
        if [ -z "$TAG" ]; then
          TAG="1.3.3"
        fi
        echo "Latest release: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Download Rust Desk client for Linux
      if: matrix.os == 'ubuntu-22.04'
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        URL="https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
        echo "Downloading: $URL"
        curl -L "$URL" -o "dist/$OUTPUT_FILE"
        if [ -f "dist/$OUTPUT_FILE" ]; then
          FILESIZE=$(stat -c%s "dist/$OUTPUT_FILE" 2>/dev/null || echo 0)
          if [ "$FILESIZE" -gt 1000 ]; then
            echo "Downloaded: $OUTPUT_FILE ($FILESIZE bytes)"
            cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
          else
            echo "::warning::File too small ($FILESIZE bytes)"
            rm -f "dist/$OUTPUT_FILE"
          fi
        fi

    - name: Download Rust Desk client for Windows
      if: matrix.os == 'windows-latest'
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: cmd
      run: |
        set OUTPUT_FILE=rustdesk-wickedyoda-%LABEL%.%EXT%
        set URL=https://github.com/rustdesk/rustdesk/releases/download/%TAG%/rustdesk-%TAG%-%ARCH%.%EXT%
        echo Downloading: %URL%
        powershell -Command "Invoke-WebRequest -Uri '%URL%' -OutFile dist\\%OUTPUT_FILE%"
        if exist dist\%OUTPUT_FILE% (
          echo Download complete
          copy dist\%OUTPUT_FILE% clients\\%OUTPUT_FILE%
        ) else (
          echo ::warning::Download failed
        )

    - name: Download Rust Desk client for macOS
      if: matrix.os == 'macos-*'
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        ASSETS_URL="https://api.github.com/repos/rustdesk/rustdesk/releases/download/${TAG}"
        
        # Try to discover actual asset name
        URL=""
        for pattern in "${TAG}-${ARCH}" "${ARCH}" "aarch64" "arm64" "x86_64"; do
          TRY_URL="${ASSETS_URL}/rustdesk-${pattern}.${EXT}"
          if curl -sf -L "$TRY_URL" -o "dist/$OUTPUT_FILE"; then
            URL="$TRY_URL"
            break
          fi
        done
        
        if [ -n "$URL" ]; then
          echo "Downloaded from: $URL"
          cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
        else
          echo "::warning::Failed to download for $LABEL"
        fi

    - name: Upload client artifact
      uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.label }}
        path: clients/
        if-no-files-found: warn

    - name: Commit client binary
      if: github.event_name != 'schedule' || matrix.label == 'linux-x86_64'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add clients/
        git commit -m "Update pre-built client: ${{ matrix.label }} (build ${GITHUB_SHA::8})" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref }} || echo "Nothing to push"

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: List all client packages
        run: |
          echo "=== Pre-built clients ==="
          ls -la clients/ 2>/dev/null || echo "No clients found"
          echo ""
          find clients/ -type f -exec ls -lh {} \; 2>/dev/null

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-clients
          
      - name: Assemble consolidated clients directory
        run: |
          mkdir -p _site/clients
          for dir in all-clients/client-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* _site/clients/ 2>/dev/null || true
            fi
          done
          ls -la _site/clients/

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: _site/clients/
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/clients/*
