name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-13
            arch: x86_64
            label: macos-x86_64
          - os: macos-14
            arch: arm64
            label: macos-aarch64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.21'

    - name: Create directories
      run: mkdir -p clients dist

    - name: Copy configuration
      run: cp local.json dist/local.json

    - name: Determine architecture suffix
      id: arch
      run: |
        case "${{ matrix.arch }}" in
          aarch64|arm64) echo "suffix=aarch64" >> $GITHUB_OUTPUT ;;
          *) echo "suffix=x86_64" >> $GITHUB_OUTPUT ;;
        esac

    - name: Download Rust Desk client
      run: |
        RELEASE_TAG=$(curl -s "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        echo "Latest release tag: $RELEASE_TAG"
        ARCH="${{ steps.arch.outputs.suffix }}"
        LABEL="${{ matrix.label }}"
        OUTPUT="rustdesk-wickedyoda-${LABEL}"

        case "${LABEL}" in
          linux-*)
            OUTPUT="${OUTPUT}.AppImage"
            curl -L "https://github.com/rustdesk/rustdesk/releases/download/${RELEASE_TAG}/rustdesk-${RELEASE_TAG}-${ARCH}.AppImage" -o "dist/$OUTPUT"
            chmod +x "dist/$OUTPUT"
            ;;
          windows-*)
            OUTPUT="${OUTPUT}.exe"
            curl -L "https://github.com/rustdesk/rustdesk/releases/download/${RELEASE_TAG}/rustdesk-${RELEASE_TAG}-${ARCH}.exe" -o "dist/$OUTPUT"
            ;;
          macos-*)
            OUTPUT="${OUTPUT}.dmg"
            URL=$(curl -sL "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" | grep "browser_download_url" | grep -i "${ARCH}" | grep -i dmg | head -1 | cut -d '"' -f 4)
            if [ -n "$URL" ]; then
              curl -L "$URL" -o "dist/$OUTPUT"
            else
              # Fallback patterns
              for patt in "aarch64" "arm64" "x86_64" "amd64"; do
                for ext in "dmg" "pkg"; do
                  TRY_URL="https://github.com/rustdesk/rustdesk/releases/download/${RELEASE_TAG}/rustdesk-${RELEASE_TAG}-${patt}.${ext}"
                  if curl -sf -L "$TRY_URL" -o "dist/$OUTPUT"; then
                    echo "Found: $TRY_URL"
                    break 2
                  fi
                done
              done
            fi
            ;;
        esac

        if [ -f "dist/$OUTPUT" ]; then
          echo "Downloaded: $OUTPUT ($(stat -c%s dist/$OUTPUT 2>/dev/null || echo 'unknown') bytes)"
          cp "dist/$OUTPUT" "clients/$OUTPUT"
        else
          echo "Download failed for $LABEL"
          echo "::warning::Failed to download client for $LABEL"
        fi

    - name: Upload client artifact
      uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.label }}
        path: clients/

    - name: Commit client binary
      if: github.event_name != 'schedule' || matrix.label == 'linux-x86_64'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add clients/
        git commit -m "Update pre-built client: ${{ matrix.label }} (build ${GITHUB_SHA::8})" || echo "No changes to commit"
        git push || echo "Nothing to push"

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List all client packages
        run: |
          echo "=== Pre-built clients ==="
          ls -la clients/ 2>/dev/null || echo "No clients found yet"
          echo ""
          find clients/ -type f -exec ls -lh {} \; 2>/dev/null || echo "Empty clients/"

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: clients/
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: clients/*
