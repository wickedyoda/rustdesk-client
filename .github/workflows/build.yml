name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
            ext: AppImage
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
            ext: AppImage
          - os: windows-latest
            label: windows-x86_64
            ext: exe
            arch: x86_64
          - os: macos-13
            arch: x86_64
            label: macos-x86_64
            ext: dmg
          - os: macos-14
            arch: arm64
            label: macos-aarch64
            ext: dmg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create directories
      shell: bash
      run: mkdir -p clients dist

    - name: Copy configuration
      shell: bash
      run: cp local.json dist/local.json

    - name: Get latest Rust Desk release tag
      id: release
      shell: bash
      run: |
        TAG=$(python3 -c "import urllib.request, json; resp=urllib.request.urlopen('https://api.github.com/repos/rustdesk/rustdesk/releases/latest'); data=json.loads(resp.read()); print(data.get('tag_name','1.4.9'))" 2>/dev/null || echo "1.4.9")
        echo "Latest Rust Desk release: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Download Rust Desk client
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ARCH: ${{ matrix.arch }}
        LABEL: ${{ matrix.label }}
        EXT: ${{ matrix.ext }}
        OS_FAMILY: ${{ matrix.os }}
      shell: bash
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        ASSET_ARCH=$ARCH
        if [ "$ARCH" = "arm64" ]; then
          ASSET_ARCH="aarch64"
        fi

        case "$OS_FAMILY" in
          ubuntu*)
            URLS=(
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${ARCH}.${EXT}"
            )
            ;;
          windows*)
            URLS=(
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.${EXT}"
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-x86_64.${EXT}"
            )
            ;;
          macos*)
            URLS=(
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ASSET_ARCH}.${EXT}"
              "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${ASSET_ARCH}.${EXT}"
            )
            ;;
        esac

        for try_url in "${URLS[@]}"; do
          echo "Trying: $try_url"
          if curl -sfL "$try_url" -o "dist/$OUTPUT_FILE"; then
            FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
            if [ "$FILESIZE" -gt 1000 ]; then
              echo "Downloaded: $try_url ($FILESIZE bytes)"
              cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
              break
            else
              echo "::warning::File too small: $try_url"
              rm -f "dist/$OUTPUT_FILE"
            fi
          fi
        done

        if [ ! -f "clients/$OUTPUT_FILE" ]; then
          echo "::warning::Failed to download for $LABEL"
        fi

    - name: Upload client artifact
      uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.label }}
        path: clients/
        if-no-files-found: warn

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-clients

      - name: Assemble clients directory
        run: |
          mkdir -p clients
          for dir in all-clients/client-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* clients/ 2>/dev/null || true
            fi
          done
          ls -la clients/

      - name: Commit clients to repository
        shell: bash
        run: |
          rm -f clients/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients/
          git commit -m "Add pre-built client packages via CI" || echo "No changes"
          git push || echo "Push may need PR due to branch protection"

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: clients/
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v$(date +%Y%m%d)"
          name: "Client Build $(date +%Y-%m-%d)"
          generate_release_notes: true
          files: clients/*
