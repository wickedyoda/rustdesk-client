name: Build & Publish Client Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            label: linux-x86_64
            ext: AppImage
          - os: ubuntu-22.04
            arch: aarch64
            label: linux-aarch64
            ext: AppImage
          - os: windows-latest
            label: windows-x86_64
            ext: exe
            arch: x86_64
          - os: macos-13
            arch: x86_64
            label: macos-x86_64
            ext: dmg
          - os: macos-14
            arch: arm64
            label: macos-aarch64
            ext: dmg

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create directories
      run: mkdir -p clients dist

    - name: Copy configuration
      run: cp local.json dist/local.json

    - name: Get latest Rust Desk release tag
      id: release
      run: |
        # Fetch latest release tag
        TAG=$(curl -s "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/"tag_name": *"\([^"]*\)"/\1/')
        if [ -z "$TAG" ]; then
          # Fallback to known releases
          TAG="1.3.3"
        fi
        echo "Latest release: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Get asset download URLs
      id: assets
      run: |
        TAG="${{ steps.release.outputs.tag }}"
        
        # Common patterns for Rust Desk releases
        case "${{ matrix.os }}" in
          ubuntu-*|windows-*)
            # Linux and Windows use predictable naming
            ARCH="${{ matrix.arch }}"
            case "${{ matrix.ext }}" in
              AppImage)
                echo "url=https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.AppImage" >> $GITHUB_OUTPUT
                ;;
              exe)
                echo "url=https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.exe" >> $GITHUB_OUTPUT
                ;;
            esac
            ;;
          macos-*)
            # macOS downloads need to be discovered from release assets
            ASSETS_URL="https://api.github.com/repos/rustdesk/rustdesk/releases/download/${TAG}"
            ARCH="${{ matrix.arch }}"
            
            # Try different naming patterns for macOS
            for pattern in "${TAG}-${ARCH}.dmg" "${ARCH}.dmg" "aarch64.dmg" "arm64.dmg"; do
              URL="${ASSETS_URL}/${pattern}"
              echo "Trying: $URL"
              if curl -sf -L "$URL" -o /dev/null; then
                echo "url=$URL" >> $GITHUB_OUTPUT
                break
              fi
            done
            ;;
        esac
        
        # If no URL found, try listing all assets
        if [ -z "${{ steps.assets.outputs.url }}" ]; then
          echo "url=" >> $GITHUB_OUTPUT
        fi

    - name: Download Rust Desk client
      env:
        DOWNLOAD_URL: "${{ steps.assets.outputs.url }}"
        RELEASE_TAG: "${{ steps.release.outputs.tag }}"
        LABEL: "${{ matrix.label }}"
        EXT: "${{ matrix.ext }}"
      run: |
        OUTPUT_FILE="rustdesk-wickedyoda-${LABEL}.${EXT}"
        
        if [ -n "$DOWNLOAD_URL" ]; then
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L "$DOWNLOAD_URL" -o "dist/$OUTPUT_FILE" || echo "Download failed"
        else
          # Fallback: try known good URLs
          TAG="$RELEASE_TAG"
          ARCH="${{ matrix.arch }}"
          
          case "$LABEL" in
            linux-*)
              curl -L "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.AppImage" -o "dist/$OUTPUT_FILE" || echo "Download failed"
              ;;
            windows-*)
              curl -L "https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${TAG}-${ARCH}.exe" -o "dist/$OUTPUT_FILE" || echo "Download failed"
              ;;
            macos-*)
              # Try alternate patterns
              for patt in "${TAG}-${ARCH}" "${ARCH}" "aarch64" "arm64" "x86_64"; do
                for ext in dmg pkg; do
                  URL="https://github.com/rustdesk/rustdesk/releases/download/${TAG}/rustdesk-${patt}.${ext}"
                  if curl -sf -L "$URL" -o "dist/$OUTPUT_FILE"; then
                    echo "Found: $URL"
                    break 2
                  fi
                done
              done
              ;;
          esac
        fi

        # Verify download
        if [ -f "dist/$OUTPUT_FILE" ]; then
          FILESIZE=$(wc -c < "dist/$OUTPUT_FILE" | tr -d ' ')
          if [ "$FILESIZE" -gt 1000 ]; then
            echo "Downloaded: $OUTPUT_FILE ($FILESIZE bytes)"
            cp "dist/$OUTPUT_FILE" "clients/$OUTPUT_FILE"
          else
            echo "::warning::File too small ($FILESIZE bytes) - download may have failed"
            echo "Removing invalid file"
            rm -f "dist/$OUTPUT_FILE"
          fi
        else
          echo "::warning::Failed to download client for $LABEL"
        fi

    - name: Upload client artifact
      uses: actions/upload-artifact@v7
      with:
        name: client-${{ matrix.label }}
        path: clients/
        if-no-files-found: warn

    - name: Commit client binary
      if: github.event_name != 'schedule' || matrix.label == 'linux-x86_64'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add clients/
        git commit -m "Update pre-built client: ${{ matrix.label }} (build ${GITHUB_SHA::8})" || echo "No changes to commit"
        git push || echo "Nothing to push"

  consolidate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: List all client packages
        run: |
          echo "=== Pre-built clients ==="
          ls -la clients/ 2>/dev/null || echo "No clients found"
          echo ""
          find clients/ -type f -exec ls -lh {} \; 2>/dev/null

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-clients
          
      - name: Assemble consolidated clients directory
        run: |
          mkdir -p _site/clients
          for dir in all-clients/client-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* _site/clients/ 2>/dev/null || true
            fi
          done
          ls -la _site/clients/

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-clients
          path: _site/clients/
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/clients/*
