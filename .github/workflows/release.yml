name: Release Rust Desk Client Packages

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Download or build client
      run: |
        curl -sL "https://raw.githubusercontent.com/wickedyoda/rustdesk-client/main/local.json" -o local.json
        mkdir -p release
        cp local.json release/
        
        # Download appropriate Rust Desk binary
        case ${{ matrix.os }} in
          ubuntu-latest)
            curl -L "https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-x86_64.AppImage" -o release/rustdesk-wickedyoda.AppImage
            chmod +x release/rustdesk-wickedyoda.AppImage
            ;;
          windows-latest)
            curl -L "https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-windows-x86_64.exe" -o release/rustdesk-wickedyoda-windows.exe
            ;;
          macos-latest)
            curl -L "https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-macos-aarch64.dmg" -o release/rustdesk-wickedyoda-macos.dmg
            ;;
        esac
    
    - name: Create release archive
      run: |
        tar -czf rustdesk-wickedyoda-${{ matrix.os }}.tar.gz -C release .
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./rustdesk-wickedyoda-${{ matrix.os }}.tar.gz
        asset_name: rustdesk-wickedyoda-${{ matrix.os }}.tar.gz
        asset_content_type: application/gzip
