name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday scans

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language: ['shell', 'python', 'javascript']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality,security-extended
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "codeql-${{ matrix.language }}"

  trivy-scan:
    name: Trivy File System Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        format: 'sarif'
        output: 'trivy-results.sarif'
        ignore-unfixed: true
        timeout: '10m'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

  script-audit:
    name: Script Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: ShellCheck (Bash Scripts)
      uses: ludeeus/action-shellcheck@master
      with:
        scripts: scripts/install-linux.sh:scripts/install-macos.sh
    
    - name: PowerShell Script Analyzer
      uses: dpreview-tools/action-powershell-script-analyzer@v2
      with:
        scripts: scripts/setup-windows.ps1
    
    - name: Yamllint (Workflow Files)
      run: |
        pip install yamllint
        yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" .github/workflows/
    
    - name: JSON Validation (local.json)
      run: |
        python3 -c "import json; json.load(open('local.json'))" && echo "JSON validation passed"

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Gitleaks (Detect Secrets)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: TruffleHog (Deep Secret Scan)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: ${{ github.sha }}
